name: "manual AWS: GPU integration tests"
on:
  workflow_dispatch:

jobs:
  start-aws-runner:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      mapping: ${{ steps.aws-start.outputs.mapping }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: arn:aws:iam::010438489691:role/GHARunnerAWS
          aws-region: us-east-2
      - name: Create cloud runner
        id: aws-start
        uses: omsf/start-aws-gha-runner@ab8ad839c760c94ae44e6782a1b20e3f591827fd  # v1.0.0
        with:
          aws_image_id: ami-076a54ed41e67782d
          aws_instance_type: g4dn.xlarge
          aws_home_dir: /home/ubuntu
          aws_root_device_size: 125
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

  self-hosted-test:
    runs-on: self-hosted
    timeout-minutes: 720  # 12 hours  
    defaults:
      run:
        shell: bash -leo pipefail {0}
    env:
      OE_LICENSE: ${{ github.workspace }}/oe_license.txt

    needs:
      - start-aws-runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Print disk usage
        run: "df -h"

      - name: Print Docker details
        run: "docker version || true"

      - name: Check for nvidia-smi
        run: "nvidia-smi"

      - name: "Setup Micromamba"
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: environment.yml
          environment-name: openfe_env
          condarc: |
            channels:
              - conda-forge
              - openeye

          # espaloma only supports python<=3.12
          create-args: >-
            espaloma_charge==0.0.8
            espaloma==0.4.0
            openeye-toolkits
            python=3.12
            cuda-version=12.8

      - name: "Check if OpenMM can get a GPU"
        run: python -m openmm.testInstallation

      - name: "Install"
        run: python -m pip install --no-deps -e .

      - name: "Test imports"
        run: |
          # if we add more to this, consider changing to for + env vars
          python -Ic "import openfe; print(openfe.__version__)"          

      - name: "Environment Information"
        run: |
          micromamba info
          micromamba list
          pip list

      - name: Test OE License & Write License to File
        env:
          OE_LICENSE_TEXT: ${{ secrets.OE_LICENSE }}
        run: |
          echo "${OE_LICENSE_TEXT}" > ${OE_LICENSE}
          python -c "import openeye; assert openeye.oechem.OEChemIsLicensed(), 'OpenEye license checks failed!'"

      - name: "Run tests"
        env:
          DUECREDIT_ENABLE: 'yes'
          OFE_INTEGRATION_TESTS: TRUE
        run: |
          # The -m flag will only run tests with @pytest.mark.integration
          pytest -n logical -vv --durations=10 -m integration src/openfecli/tests/ src/openfe/tests/

  stop-aws-runner:
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read
    needs:
      - start-aws-runner
      - self-hosted-test
    if: ${{ always() }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: arn:aws:iam::010438489691:role/GHARunnerAWS
          aws-region: us-east-2
      - name: Stop instances
        uses: omsf/stop-aws-gha-runner@a3d2e34cba8571eaf9b40ae00705d6b2b77402f6  # v1.0.0
        with:
          instance_mapping: ${{ needs.start-aws-runner.outputs.mapping }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
