name: "cron: conda builds daily tests"
on:
  workflow_dispatch:
  schedule:
    # At 05:17 UTC monday-friday
    - cron: "17 5 * * 1-5"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  condacheck:
    runs-on: ${{ matrix.OS }}
    name: "daily conda check"
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        include:
        - os: "macos-latest"
          python-version: "3.13"
          openeye: "no"
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          path: openfe_repo

      - name: Get Latest Version
        id: latest-version
        working-directory: openfe_repo
        run: |
          REPO="${{ github.repository }}"
          VERSION=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/$REPO/releases/latest" | jq -r '.tag_name | ltrimstr("v")')
          echo $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Micromamba and Install openfe
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-name: openfe
          create-args: >-
            python=${{ matrix.python-version }}
            openfe=${{ steps.latest-version.outputs.VERSION }}
            pytest
            pytest-xdist
          condarc: |
            channels:
              - conda-forge
          init-shell: bash


      - name: "env info"
        run: |
          micromamba info
          micromamba list

      - id: download-test-data
        name: "Download test data"
        run: |
          openfe test --download-only

      - id: run-tests
        name: "Run tests"
        run: |
          # note: this only runs the fast tests
          pytest -n auto --pyargs openfe openfecli
