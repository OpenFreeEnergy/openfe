name: openfe_env
channels:
  - conda-forge
dependencies:
  - cudatoolkit==11.8
  - jupyterlab
  - notebook
  - openfe
  - pip >=26.2.2  # security incident https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
  - py3dmol
  - pytest
  - pytest-xdist
  - python==3.13.*
  - rdkit~=2025.09.1  # https://github.com/OpenFreeEnergy/gufe/pull/665, https://github.com/OpenFreeEnergy/openfe/pull/2068
  - run_constrained:
    - certifi >=2026.10.19  # security incident https://discuss.python.org/t/information-for-python-users-regarding-emudhra-emsign-ca-certificate-security-incident/109576
